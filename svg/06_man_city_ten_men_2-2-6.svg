 cy="335" r="4.5" fill="#C8102E"/><text x="714.0" y="340.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Šeško only arrived in the 67th minute. Game state</text><text x="714.0" y="362.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">also matters here (City led).</text><text x="690.0" y="586.0" font-size="16" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Key</text><circle cx="708" cy="610" r="9" fill="#C8102E"/><text x="736.0" y="615.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Man United player</text><circle cx="708" cy="638" r="9" fill="#34507F"/><text x="736.0" y="643.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Opponent</text><path d="M701 659 L715 673 M701 673 L715 659" stroke="#1F2933" stroke-width="3.5" stroke-linecap="round"/><text x="736.0" y="671.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Shot from outside box</text><circle cx="708" cy="694" r="7" fill="#E08A00"/><text x="736.0" y="699.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Shot inside box</text><text x="40.0" y="788.0" font-size="12" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Schematic whiteboard illustration: player positions are approximate, not tracked data. Match figures come from the analysed report.</text></svg>