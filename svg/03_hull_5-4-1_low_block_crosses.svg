 Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">four directly in front.</text><circle cx="698" cy="223" r="4.5" fill="#C8102E"/><text x="714.0" y="228.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">United became a 4-2-4-0 with Cunha dropping, so no</text><text x="714.0" y="250.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">striker pinned the back five.</text><circle cx="698" cy="279" r="4.5" fill="#C8102E"/><text x="714.0" y="284.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">39 crosses, only 9 found a teammate. Low-value</text><text x="714.0" y="306.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">pattern forced by the block.</text><circle cx="698" cy="335" r="4.5" fill="#C8102E"/><text x="714.0" y="340.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">xG per shot was 0.087, right on the average. This</text><text x="714.0" y="362.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">was not a shot-quality failure: it was blocks plus</text><text x="714.0" y="384.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">zero goals.</text><text x="690.0" y="586.0" font-size="16" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Key</text><circle cx="708" cy="610" r="9" fill="#C8102E"/><text x="736.0" y="615.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Man Uni