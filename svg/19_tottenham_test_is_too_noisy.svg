<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#E08A00"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#374151"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C0392B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E8B57"/></marker></defs><rect width="1200" height="800" fill="#fff"/><text x="40.0" y="48.0" font-size="28" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">19. One match cannot confirm or refute the Tottenham test</text><text x="40.0" y="78.0" font-size="17" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Rough estimate: 15-20 shots gives a standard error of about 0.025-0.03 on xG per shot</text><rect x="478.6" y="150" width="242.9" height="240" fill="#E08A00" fill-opacity=".15"/><rect x="335.7" y="180" width="385.7" height="50" rx="6" fill="#34507F" fill-opacity=".85"/><rect x="478.6" y="290" width="385.7" height="50" rx="6" fill="#2E8B57" fill-opacity=".85"/><circle cx="528.6" cy="205" r="9" fill="#fff"/><circle cx="671.4" cy="315" r="9" fill="#fff"/><text x="325.7" y="212.0" font-size="15" text-anchor="end" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#34507F">Baseline 0.09, plausible range 0.063-0.117</text><text x="874.3" y="322.0" font-size="15" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#2E8B57">Target 0.11, plausible range 0.083-0.137</text><text x="600.0" y="170.0" font-size="14" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">overlap</text><line x1="100" y1="420" x2="1100" y2="420" stroke="#1F2933" stroke-width="2"/><line x1="171.4" y1="420" x2="171.4" y2="428" stroke="#1F2933" stroke-width="2"/><text x="171.4" y="448.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">0.04</text><line x1="314.3" y1="420" x2="314.3" y2="428" stroke="#1F2933" stroke-width="2"/><text x="314.3" y="448.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">0.06</text><line x1="457.1" y1="420" x2="457.1" y2="428" stroke="#1F2933" stroke-width="2"/><text x="457.1" y="448.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">0.08</text><line x1="600.0" y1="420" x2="600.0" y2="428" stroke="#1F2933" stroke-width="2"/><text x="600.0" y="448.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">0.10</text><line x1="742.9" y1="420" x2="742.9" y2="428" stroke="#1F2933" stroke-width="2"/><text x="742.9" y="448.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">0.12</text><line x1="885.7" y1="420" x2="885.7" y2="428" stroke="#1F2933" stroke-width="2"/><text x="885.7" y="448.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">0.14</text><line x1="1028.6" y1="420" x2="1028.6" y2="428" stroke="#1F2933" stroke-width="2"/><text x="1028.6" y="448.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">0.16</text><text x="600.0" y="478.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">xG per shot in a single match</text><circle cx="48" cy="535" r="4.5" fill="#C8102E"/><text x="62.0" y="540.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">A 0.02 difference is smaller than one standard error, so a single good or bad match tells you almost nothing.</text><circle cx="48" cy="565" r="4.5" fill="#C8102E"/><text x="62.0" y="570.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">The other targets (cutbacks, box touches, 60% shots inside the box) have no baseline at all.</text><circle cx="48" cy="595" r="4.5" fill="#C8102E"/><text x="62.0" y="600.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Use several matches and define baselines first. Standard error here is a rough estimate, not computed from shot-level data.</text><text x="40.0" y="788.0" font-size="12" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Figures come from the analysed report table; ratios recomputed here. Match data not independently verified.</text></svg>