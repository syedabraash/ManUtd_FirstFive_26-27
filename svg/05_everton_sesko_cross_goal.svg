 font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">wide. 2 Shaw crosses to the front post area.</text><circle cx="698" cy="223" r="4.5" fill="#C8102E"/><text x="714.0" y="228.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">With a real striker between the centre-backs, the</text><text x="714.0" y="250.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">same wide move ends in a goal.</text><circle cx="698" cy="279" r="4.5" fill="#C8102E"/><text x="714.0" y="284.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Careful: this is one goal in about 20 minutes. It</text><text x="714.0" y="306.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">supports the hypothesis, it does not prove it.</text><text x="690.0" y="586.0" font-size="16" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Key</text><circle cx="708" cy="610" r="9" fill="#C8102E"/><text x="736.0" y="615.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Man United player</text><circle cx="708" cy="638" r="9" fill="#34507F"/><text x="736.0" y="643.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Opponent</text><path d="M690 666 L724 666" stroke="#E08A00" stroke-width="3.5" marker-end="url(#ao)" fill="none"/><text x="736.0" y="671.0" font-size="15" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Ball / pass / cross</text><path d="M690 694 L724 694" stroke="#374151"