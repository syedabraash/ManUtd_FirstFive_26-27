<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#E08A00"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#374151"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C0392B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E8B57"/></marker></defs><rect width="1200" height="800" fill="#fff"/><text x="40.0" y="48.0" font-size="28" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">20. How strong is each claim in the report?</text><text x="40.0" y="78.0" font-size="17" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Overall assessment after recomputing the numbers and checking the logic</text><rect x="40" y="120" width="270" height="340" rx="12" fill="#E8F5EC" stroke="#2E8B57" stroke-width="2.5"/><text x="58.0" y="154.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">Most solid</text><text x="58.0" y="186.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">Description of the 3-2 / 3-2-4-1</text><text x="58.0" y="208.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">build-up shapes. United create</text><text x="58.0" y="230.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">many shots of modest average</text><text x="58.0" y="252.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">quality (about 0.064 per shot</text><text x="58.0" y="274.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">without Ipswich).</text><rect x="330" y="120" width="270" height="340" rx="12" fill="#FFF3DC" stroke="#E08A00" stroke-width="2.5"/><text x="348.0" y="154.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">Reasonable, unproven</text><text x="348.0" y="186.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">Box-occupation mechanism (false</text><text x="348.0" y="208.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">nine drains the box). Šeško as a</text><text x="348.0" y="230.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">reference point. Both rest on a</text><text x="348.0" y="252.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">handful of matches.</text><rect x="620" y="120" width="270" height="340" rx="12" fill="#FBE9E7" stroke="#C0392B" stroke-width="2.5"/><text x="638.0" y="154.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">Weak</text><text x="638.0" y="186.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">Transition-cost claim. Fulham as</text><text x="638.0" y="208.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">low-quality evidence (provider-</text><text x="638.0" y="230.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">dependent). Tottenham targets as</text><text x="638.0" y="252.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">a real test.</text><rect x="910" y="120" width="250" height="340" rx="12" fill="#F1F2F4" stroke="#6B7280" stroke-width="2.5"/><text x="928.0" y="154.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#374151">Missing</text><text x="928.0" y="186.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#374151">Game-state controls. Opponent</text><text x="928.0" y="208.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#374151">quality. One consistent xG</text><text x="928.0" y="230.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#374151">source across all five</text><text x="928.0" y="252.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#374151">matches.</text><rect x="40" y="490" width="1120" height="150" rx="12" fill="#F1F2F4" stroke="#6B7280" stroke-width="2.5"/><text x="58.0" y="524.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#374151">Awkward fact</text><text x="58.0" y="556.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#374151">The report's own season-level model has United at +5.3 xGD and fourth on expected points. That sits uneasily with calling the attack the problem.</text><text x="40.0" y="788.0" font-size="12" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Figures come from the analysed report table; ratios recomputed here. Match data not independently verified.</text></svg>