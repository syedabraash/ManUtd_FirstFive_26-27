<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#E08A00"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#374151"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C0392B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E8B57"/></marker></defs><rect width="1200" height="800" fill="#fff"/><text x="40.0" y="48.0" font-size="28" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">17. The Šeško evidence is two short cameos</text><text x="40.0" y="78.0" font-size="17" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Roughly 20 and 23 minutes of football. A reasonable hypothesis, not a demonstrated cause</text><text x="40.0" y="140.0" font-size="20" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Everton 2-2 Man United</text><text x="40.0" y="178.0" font-size="15" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Šeško on pitch</text><rect x="200" y="160" width="900" height="26" rx="4" fill="#EEF0F2"/><rect x="900.0" y="160" width="200.0" height="26" rx="4" fill="#E08A00"/><text x="1000.0" y="178.0" font-size="14" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff">on 70' to full time</text><circle cx="1080.0" cy="173" r="11" fill="#2E8B57" stroke="#fff" stroke-width="2"/><text x="1080.0" y="214.0" font-size="14" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#2E8B57">Goal, 88'</text><line x1="200" y1="230" x2="1100" y2="230" stroke="#1F2933" stroke-width="2"/><line x1="200.0" y1="230" x2="200.0" y2="238" stroke="#1F2933" stroke-width="2"/><text x="200.0" y="256.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">0'</text><line x1="350.0" y1="230" x2="350.0" y2="238" stroke="#1F2933" stroke-width="2"/><text x="350.0" y="256.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">15'</text><line x1="500.0" y1="230" x2="500.0" y2="238" stroke="#1F2933" stroke-width="2"/><text x="500.0" y="256.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">30'</text><line x1="650.0" y1="230" x2="650.0" y2="238" stroke="#1F2933" stroke-width="2"/><text x="650.0" y="256.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">45'</text><line x1="800.0" y1="230" x2="800.0" y2="238" stroke="#1F2933" stroke-width="2"/><text x="800.0" y="256.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">60'</text><line x1="950.0" y1="230" x2="950.0" y2="238" stroke="#1F2933" stroke-width="2"/><text x="950.0" y="256.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">75'</text><line x1="1100.0" y1="230" x2="1100.0" y2="238" stroke="#1F2933" stroke-width="2"/><text x="1100.0" y="256.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">90'</text><text x="40.0" y="330.0" font-size="20" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Man United 0-1 Man City</text><text x="40.0" y="368.0" font-size="15" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">City down to ten</text><rect x="200" y="350" width="900" height="26" rx="4" fill="#EEF0F2"/><rect x="430.0" y="350" width="670.0" height="26" rx="4" fill="#C0392B"/><text x="765.0" y="368.0" font-size="14" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff">United vs ten men: 67 minutes</text><text x="40.0" y="408.0" font-size="15" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Šeško on pitch</text><rect x="200" y="390" width="900" height="26" rx="4" fill="#EEF0F2"/><rect x="870.0" y="390" width="230.0" height="26" rx="4" fill="#E08A00"/><text x="985.0" y="408.0" font-size="14" text-anchor="middle" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff">on 67'</text><line x1="200" y1="430" x2="1100" y2="430" stroke="#1F2933" stroke-width="2"/><line x1="200.0" y1="430" x2="200.0" y2="438" stroke="#1F2933" stroke-width="2"/><text x="200.0" y="456.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">0'</text><line x1="350.0" y1="430" x2="350.0" y2="438" stroke="#1F2933" stroke-width="2"/><text x="350.0" y="456.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">15'</text><line x1="500.0" y1="430" x2="500.0" y2="438" stroke="#1F2933" stroke-width="2"/><text x="500.0" y="456.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">30'</text><line x1="650.0" y1="430" x2="650.0" y2="438" stroke="#1F2933" stroke-width="2"/><text x="650.0" y="456.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">45'</text><line x1="800.0" y1="430" x2="800.0" y2="438" stroke="#1F2933" stroke-width="2"/><text x="800.0" y="456.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">60'</text><line x1="950.0" y1="430" x2="950.0" y2="438" stroke="#1F2933" stroke-width="2"/><text x="950.0" y="456.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">75'</text><line x1="1100.0" y1="430" x2="1100.0" y2="438" stroke="#1F2933" stroke-width="2"/><text x="1100.0" y="456.0" font-size="14" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">90'</text><circle cx="48" cy="515" r="4.5" fill="#C8102E"/><text x="62.0" y="520.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Everton: Šeško on at 70, goal at 88 from a Shaw cross. A real box target helps the cross, but it is one goal.</text><circle cx="48" cy="545" r="4.5" fill="#C8102E"/><text x="62.0" y="550.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">City: United had 67 minutes against ten men; Šeško only played the last 23 and nothing is reported from his spell.</text><circle cx="48" cy="575" r="4.5" fill="#C8102E"/><text x="62.0" y="580.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Conclusion: supports "a striker pins the centre-backs" as something to test, not as a finding.</text><text x="40.0" y="788.0" font-size="12" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Figures come from the analysed report table; ratios recomputed here. Match data not independently verified.</text></svg>