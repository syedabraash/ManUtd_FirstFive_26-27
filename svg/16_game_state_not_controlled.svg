<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#E08A00"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#374151"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#C0392B"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#2E8B57"/></marker></defs><rect width="1200" height="800" fill="#fff"/><text x="40.0" y="48.0" font-size="28" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">16. The biggest omission: game state</text><text x="40.0" y="78.0" font-size="17" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">None of the report's analysis controls for the scoreline (goal timings not checked here)</text><rect x="40" y="120" width="350" height="330" rx="12" fill="#FBE9E7" stroke="#C0392B" stroke-width="2.5"/><text x="58.0" y="154.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">Hull (lost 0-2)</text><text x="58.0" y="186.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">United were chasing the game against a team</text><text x="58.0" y="208.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">happy to defend. 71.7% possession, 39</text><text x="58.0" y="230.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">crosses and 21 shots are partly the</text><text x="58.0" y="252.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">scoreline, not only tactics.</text><rect x="425" y="120" width="350" height="330" rx="12" fill="#FBE9E7" stroke="#C0392B" stroke-width="2.5"/><text x="443.0" y="154.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">City (lost 0-1)</text><text x="443.0" y="186.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">City went down to ten after 23 minutes but</text><text x="443.0" y="208.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">were leading. A deliberate low block</text><text x="443.0" y="230.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">explains some of the low shot quality,</text><text x="443.0" y="252.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7B241C">regardless of United's structure.</text><rect x="810" y="120" width="350" height="330" rx="12" fill="#FFF3DC" stroke="#E08A00" stroke-width="2.5"/><text x="828.0" y="154.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">Possession is a weak signal</text><text x="828.0" y="186.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">Trailing teams hold the ball more, leading</text><text x="828.0" y="208.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">teams less. High possession says little</text><text x="828.0" y="230.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#7A4A00">about attacking intent on its own.</text><rect x="40" y="480" width="1120" height="150" rx="12" fill="#E8F5EC" stroke="#2E8B57" stroke-width="2.5"/><text x="58.0" y="514.0" font-size="19" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">Fairer test</text><text x="58.0" y="546.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1B5E3A">Compare level-score minutes only, and add opponent quality. The report does neither, so every structural claim is partly confounded by game state.</text><text x="40.0" y="788.0" font-size="12" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Figures come from the analysed report table; ratios recomputed here. Match data not independently verified.</text></svg>