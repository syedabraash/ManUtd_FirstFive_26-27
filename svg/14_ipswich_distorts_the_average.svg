ly="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">outlier.</text><circle cx="808" cy="301" r="4.5" fill="#C8102E"/><text x="824.0" y="306.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Ipswich also conceded 2.06 xG from 9</text><text x="824.0" y="328.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">shots: an open game may explain part</text><text x="824.0" y="350.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">of it.</text><text x="40.0" y="788.0" font-size="12" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Figures come from the analysed report table; ratios recomputed here. Match data not independently verified.</text></svg>