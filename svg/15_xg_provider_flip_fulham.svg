troke="#1F2933" stroke-width="2"/><line x1="640" y1="259.4" x2="1080" y2="259.4" stroke="#34507F" stroke-width="2.5" stroke-dasharray="9 6"/><text x="1080.0" y="251.4" font-size="14" text-anchor="end" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round">five-match average 0.0875</text><text x="1080.0" y="251.4" font-size="14" text-anchor="end" font-weight="bold" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#34507F">five-match average 0.0875</text><circle cx="48" cy="595" r="4.5" fill="#C8102E"/><text x="62.0" y="600.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Under provider one, Fulham is a clear low-quality match (0.055 per shot, well below average).</text><circle cx="48" cy="625" r="4.5" fill="#C8102E"/><text x="62.0" y="630.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Under provider two it is above the average (0.104 per shot). Same shots, opposite story.</text><circle cx="48" cy="655" r="4.5" fill="#C8102E"/><text x="62.0" y="660.0" font-size="16" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#1F2933">Blending sources across the report means the xG comparisons are not like-for-like.</text><text x="40.0" y="788.0" font-size="12" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" fill="#6B7280">Figures come from the analysed report table; ratios recomputed here. Match data not independently verified.</text></svg>